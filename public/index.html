function home(){const s=S.s,ft=lines(s.feats),lv=[...new Set(live().map(p=>p.level).filter(Boolean))];
return `<div class="hero" ${s.hero?`style="background-image:linear-gradient(#0009,#0009),url('${s.hero}')"`:''}><div class="wrap hi"><div class="ht"><span class="pill">🏔️ বাংলাদেশের এডভেঞ্চার ট্রাভেল গ্রুপ</span><h1>${esc(s.name)}</h1><div class="sl">${esc(s.slogan)}</div><p>${esc(s.tag)}</p><div class="hb"><a class="btn" href="#packages">প্যাকেজ দেখুন</a><a class="btn gl" href="#how">কীভাবে বুক করবেন</a></div><ul class="tr">${ft.slice(0,3).map(x=>`<li>✔ ${esc(x)}</li>`).join('')}</ul></div><div class="hl"><img src="${s.logo}" alt="${esc(s.name)}"></div></div><svg class="wv" viewBox="0 0 1200 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 60V35l150-22 120 20 160-28 140 30 150-24 130 22 170-26 180 30v43z" fill="var(--bg)"/></svg></div>
<section id="packages"><div class="wrap"><span class="ey">Our Adventures</span><h2>আমাদের এডভেঞ্চার প্যাকেজ</h2><p class="sb">পছন্দের ট্যুর বেছে নিন, বিস্তারিত দেখুন, তারপর বুক করুন।</p><div class="tb"><input id="q" type="search" placeholder="🔍 স্থান বা প্যাকেজ খুঁজুন…" value="${esc(F.q)}"><div class="ch"><button data-lv="" class="${F.l?'':'on'}">সব</button>${lv.map(l=>`<button data-lv="${esc(l)}" class="${F.l==l?'on':''}">${esc(l)}</button>`).join('')}</div></div><div class="grid rv" id="gr">${gridHtml()}</div></div></section>
<section id="prices" class="alt"><div class="wrap"><span class="ey">Pricing</span><h2>মূল্য তালিকা</h2><p class="sb">জনপ্রতি মূল্য (ডিসকাউন্ট সহ)।</p><div class="scr rv"><table><tr><th>প্যাকেজ</th><th>সময়</th><th>নিয়মিত</th><th>ছাড়</th><th>আপনার মূল্য</th></tr>${live().map(p=>`<tr><td><a href="#package-${p.id}"><b>${esc(p.title)}</b></a></td><td>${esc(p.days)}</td><td>${p.disc>0?`<s>৳${bn(p.price)}</s>`:`৳${bn(p.price)}`}</td><td>${p.disc>0?bn(p.disc)+'%':'—'}</td><td><b style="color:var(--acc)">৳${bn(fin(p))}</b></td></tr>`).join('')}</table></div></div></section>
<section id="how"><div class="wrap"><span class="ey">How it works</span><h2>বুকিং করবেন যেভাবে</h2><p class="sb">মাত্র তিনটি সহজ ধাপ।</p><div class="steps rv"><div class="st"><i>১</i><b>প্যাকেজ বাছুন</b><span>পছন্দের ট্যুরের বিবরণ, ছবি ও মূল্য দেখে নিন।</span></div><div class="st"><i>২</i><b>প্যাকেজ খুলে ফর্ম পূরণ করুন</b><span>প্যাকেজে ক্লিক করে নাম, ফোন, জনসংখ্যা ও তারিখ দিন; মোট খরচ দেখে নিন।</span></div><div class="st"><i>৩</i><b>WhatsApp-এ কনফার্ম করুন</b><span>ফর্মের তথ্য সহ আমাদের WhatsApp-এ চলে যান, বাকিটা আমরা জানাব।</span></div></div></div></section>
<section id="about" class="alt"><div class="wrap"><span class="ey">About us</span><h2>আমাদের সম্পর্কে</h2><p style="max-width:760px">${esc(s.about)}</p><div class="feat rv">${ft.map((x,i)=>`<div><i>${['🧭','💰','🛡️','💬','⭐','🏕️'][i%6]}</i>${esc(x)}</div>`).join('')}</div></div></section>
<section id="faq"><div class="wrap" style="max-width:780px"><span class="ey">FAQ</span><h2>সাধারণ প্রশ্নোত্তর</h2><p class="sb">যা প্রায়ই জানতে চাওয়া হয়।</p>${lines(s.faq).map(l=>{const [q,...a]=l.split('|');return `<details><summary>${esc(q)}</summary><p>${esc(a.join('|'))}</p></details>`}).join('')}</div></section>
<section><div class="wrap"><div class="cta rv"><div class="sl">${esc(s.slogan)}</div><h2>আপনার পরবর্তী এডভেঞ্চার শুরু হোক আজই</h2><p style="margin:8px 0 20px">সিট সীমিত — আজই আপনার জায়গা নিশ্চিত করুন।</p><a class="btn" href="#packages">প্যাকেজ বেছে নিন</a></div></div></section>`}
function detail(p){cur=p;G=0;const o=live().filter(x=>x.id!=p.id).slice(0,3);return `<div class="wrap pg"><div class="bc"><a href="#home">হোম</a> › <a href="#packages">প্যাকেজ</a> › ${esc(p.title)}</div><div class="dl"><div><div class="big" id="big" ${bg(p.imgs[0])}>${p.imgs.length>1?'<button class="ar l" data-nx="-1" aria-label="আগের ছবি">‹</button><button class="ar r" data-nx="1" aria-label="পরের ছবি">›</button>':''}</div>${p.imgs.length>1?`<div class="th" style="margin-top:8px">${p.imgs.map((u,i)=>`<i data-img="${i}" class="${i?'':'on'}" ${bg(u)}></i>`).join('')}</div>`:''}<h1 class="pt">${esc(p.title)}</h1><div class="fx">${facts(p)}</div><h3>ট্যুরের বিবরণ</h3><div class="dt">${esc(p.details)}</div></div><aside class="side"><div class="bx" id="bf"><div class="pr">${money(p)}<small> /জন</small></div>${p.disc>0?`<div class="sv">🎉 ${bn(p.disc)}% ছাড়ে জনপ্রতি সাশ্রয় ৳${bn(p.price-fin(p))}</div>`:''}<h3 style="margin:4px 0 0">এই ট্যুর বুক করুন</h3><label>আপনার নাম<input id="bnm" autocomplete="name"></label><label>মোবাইল নাম্বার<input id="bmb" inputmode="tel" autocomplete="tel"></label><label>কতজন যাবেন<div class="stp"><button type="button" data-q="-1">−</button><input id="bq" type="number" min="1" value="1"><button type="button" data-q="1">+</button></div></label><label>পছন্দের তারিখ<input id="bdt" type="date"></label><label>অতিরিক্ত তথ্য (ঐচ্ছিক)<textarea id="bnt" rows="2"></textarea></label><div class="rw tot"><span id="qt"></span><b id="tt"></b></div><div class="err" id="err"></div><a class="btn wa full" id="go" target="_blank" rel="noopener">WhatsApp-এ বুক করুন</a><p class="nt">বাটনে চাপলে আপনার তথ্য সহ WhatsApp খুলবে, সেখান থেকেই বুকিং কনফার্ম হবে।</p></div></aside></div>${o.length?`<h3 style="margin-top:34px">আরও প্যাকেজ</h3><div class="grid">${o.map(card).join('')}</div>`:''}</div><div class="bar"><div class="pr">${money(p)}</div><a class="btn" data-go="1" href="#" >বুক করুন</a></div>`}
function bookInit(p){$('#bdt').min=new Date().toISOString().slice(0,10);const f=()=>{const q=Math.max(1,+$('#bq').value||1),t=fin(p)*q;$('#qt').textContent=`মোট (${bn(q)} জন × ৳${bn(fin(p))})`;$('#tt').textContent='৳'+bn(t);const m=`হ্যালো, আমি বুকিং করতে চাই।\nপ্যাকেজ: ${p.title}\nনাম: ${$('#bnm').value}\nমোবাইল: ${$('#bmb').value}\nজন: ${q}\nতারিখ: ${$('#bdt').value||'—'}\nমোট: ৳${t}\nনোট: ${$('#bnt').value||'—'}`;$('#go').href='https://wa.me/'+S.s.wa.replace(/\D/g,'')+'?text='+encodeURIComponent(m)};document.querySelectorAll('#bf input,#bf textarea').forEach(e=>e.oninput=f);f();$('#go').onclick=e=>{if(!$('#bnm').value.trim()||!$('#bmb').value.trim()){e.preventDefault();$('#err').textContent='দয়া করে নাম ও মোবাইল নাম্বার দিন।'}else $('#err').textContent=''}}
const rv=()=>{const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.08});document.querySelectorAll('.rv').forEach(e=>io.observe(e));setTimeout(()=>document.querySelectorAll('.rv').forEach(e=>e.classList.add('in')),1500)};
function route(){const h=location.hash.slice(1),m=$('#app');$('#nv').classList.remove('open');scrollTo(0,0);if(h.startsWith('package-')){const p=S.pkgs.find(x=>x.id==h.slice(8));m.innerHTML=p?detail(p):home();if(p)bookInit(p)}else{m.innerHTML=home();if(['packages','prices','how','about','faq'].includes(h))$('#'+h).scrollIntoView()}rv()}
function theme(){const s=S.s;$('#th').textContent=`:root{--pri:${s.c1};--acc:${s.c2};--ph:${PH}}`;$('#lg').src=s.logo;$('#bn').textContent=s.name;$('#sg').textContent=s.slogan;document.title=s.name+' | '+s.slogan;$('#ft').innerHTML=`<div class="wrap fg"><div><img src="${s.logo}" alt=""><p class="sl2">${esc(s.slogan)}</p><p>${esc(s.tag)}</p></div><div><b>দ্রুত লিংক</b><a href="#prices">মূল্য তালিকা</a><a href="#faq">প্রশ্নোত্তর</a><a href="https://wa.me/${s.wa.replace(/\D/g,'')}?text=${encodeURIComponent('হ্যালো, আমি কাস্টম ট্যুর/প্রশ্ন নিয়ে জানতে চাই।')}" target="_blank" rel="noopener">কাস্টম ট্যুর বা প্রশ্ন? WhatsApp-এ লিখুন</a></div><div><b>আমাদের সম্পর্কে</b><p>${esc(s.about.slice(0,140))}…</p></div></div><div class="cp">${esc(s.foot)} · <a href="#" data-login="1" style="opacity:.55">অ্যাডমিন</a></div>`}
/* ---- admin ---- */
const fld=(o,k,l,t='text')=>{const v=(o=='p'?A.ed:S.s)[k];return `<label>${l}${t=='area'?`<textarea rows="5" data-o="${o}" data-k="${k}">${esc(v)}</textarea>`:`<input type="${t}" data-o="${o}" data-k="${k}" value="${esc(v)}">`}</label>`};
function pkList(){return `<button class="btn" data-a="new">＋ নতুন প্যাকেজ</button>${S.pkgs.map(p=>`<div class="row"><div><b>${esc(p.title)}</b><br><small>৳${bn(p.price)}${p.disc>0?' · '+bn(p.disc)+'% ছাড়':''}${p.on?'':' · লুকানো'}</small></div><span><button class="btn sm gh" data-a="up" data-v="${p.id}" title="উপরে নিন">↑</button><button class="btn sm" data-a="edit" data-v="${p.id}">এডিট</button><button class="btn sm gh" data-a="del" data-v="${p.id}">${A.del==p.id?'নিশ্চিত?':'মুছুন'}</button></span></div>`).join('')}`}
function pkForm(){const p=A.ed;return `<button class="btn sm gh" style="color:var(--tx)" data-a="back">← তালিকায় ফিরুন</button>${fld('p','title','প্যাকেজের নাম')}${fld('p','badge','ব্যাজ (যেমন: জনপ্রিয়, নতুন)')}<div class="two">${fld('p','loc','স্থান')}${fld('p','days','সময়কাল')}${fld('p','date','তারিখ/সিজন')}${fld('p','level','কাঠিন্য')}${fld('p','price','মূল্য (৳)','number')}${fld('p','disc','ডিসকাউন্ট (%)','number')}</div><label><span><input type="checkbox" style="width:auto" data-o="p" data-k="on" ${p.on?'checked':''}> সাইটে দেখান</span></label>${fld('p','details','বিস্তারিত বিবরণ','area')}<label>ছবি (একাধিক নেওয়া যাবে)<input type="file" accept="image/*" multiple data-f="imgs"></label><div class="imgs">${p.imgs.map((u,i)=>`<div ${bg(u)}><b data-a="rmimg" data-v="${i}">×</b></div>`).join('')}</div>`}
function setForm(){return `${fld('s','name','ওয়েবসাইটের নাম')}${fld('s','slogan','ট্যাগলাইন (ইংরেজি)')}${fld('s','tag','হিরো সাবটাইটেল','area')}${fld('s','wa','WhatsApp নাম্বার (দেশ কোড সহ, যেমন 8801712345678)')}${fld('s','about','আমাদের সম্পর্কে','area')}${fld('s','feats','বৈশিষ্ট্য (প্রতি লাইনে একটি)','area')}${fld('s','faq','প্রশ্নোত্তর (প্রতি লাইনে: প্রশ্ন|উত্তর)','area')}${fld('s','foot','ফুটার লেখা')}<div class="two">${fld('s','c1','প্রধান রং','color')}${fld('s','c2','অ্যাকসেন্ট রং','color')}</div><label>লোগো বদলান<input type="file" accept="image/*" data-f="logo"></label><label>হিরো ব্যাকগ্রাউন্ড ছবি<input type="file" accept="image/*" data-f="hero"></label>`}
function paint(){$('#adm').innerHTML=(admin&&!A.open?`<button class="btn fab" data-a="open">⚙️ অ্যাডমিন</button>`:'')+(A.open?`<div class="ov"><div class="pn"><div class="ph"><b>অ্যাডমিন প্যানেল</b><span><button class="btn sm" data-a="save">${A.busy||'সেভ ও প্রকাশ'}</button><button class="btn sm gh" data-a="close">✕</button></span></div><div class="tabs"><button class="${A.tab=='p'?'on':''}" data-a="tab" data-v="p">প্যাকেজ</button><button class="${A.tab=='s'?'on':''}" data-a="tab" data-v="s">ওয়েবসাইট সেটিং</button></div><div class="pb">${A.tab=='s'?setForm():A.ed?pkForm():pkList()}</div></div></div>`:'')}
const T=()=>sessionStorage.getItem('t')||'';
const shrink=async(f,max)=>{const b=await createImageBitmap(f),k=Math.min(1,max/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));try{const r=await fetch('/api/img',{method:'POST',headers:{Authorization:'Bearer '+T(),'Content-Type':'image/jpeg'},body:bl});if(!r.ok)throw 0;return '/api/img/'+(await r.json()).id}catch(e){alert('ছবি আপলোড হয়নি। পাসওয়ার্ড ও ইন্টারনেট দেখুন।');return ''}};
async function save(){A.busy='সেভ হচ্ছে…';paint();try{const r=await fetch('/api/data',{method:'PUT',headers:{Authorization:'Bearer '+T(),'Content-Type':'application/json'},body:JSON.stringify(S)});if(r.status==401){sessionStorage.removeItem('t');admin=false;A.open=false;paint();return alert('পাসওয়ার্ড ভুল বা মেয়াদ শেষ। আবার লগইন করুন।')}if(!r.ok)throw 0;A.busy='সেভ হয়েছে ✔'}catch(e){A.busy='সেভ হয়নি'}paint();setTimeout(()=>{A.busy='';paint()},2500)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a],[data-book],[data-img]');if(!t)return;const d=t.dataset;if(d.book)sel=d.book;if(!d.a)return;const a=d.a;if(a=='open')A.open=true;if(a=='close'){A.open=false;A.ed=null;theme();route()}if(a=='tab'){A.tab=d.v;A.ed=null}if(a=='new'){A.ed={id:'p'+Date.now(),on:true,title:'নতুন প্যাকেজ',loc:'',days:'',date:'',level:'সহজ',price:0,disc:0,imgs:[],details:''};S.pkgs.push(A.ed)}if(a=='edit')A.ed=S.pkgs.find(p=>p.id==d.v);if(a=='back'){A.ed=null}if(a=='del'){if(A.del==d.v){S.pkgs=S.pkgs.filter(p=>p.id!=d.v);A.del=''}else A.del=d.v}if(a=='rmimg')A.ed.imgs.splice(+d.v,1);if(a=='up'){const i=S.pkgs.findIndex(p=>p.id==d.v);if(i>0)[S.pkgs[i-1],S.pkgs[i]]=[S.pkgs[i],S.pkgs[i-1]]}if(a=='save'){save();return}paint()});
document.addEventListener('input',e=>{const t=e.target,o=t.dataset.o;if(!o)return;const x=o=='p'?A.ed:S.s;x[t.dataset.k]=t.type=='checkbox'?t.checked:t.type=='number'?+t.value:t.value;if(o=='s')theme()});
document.addEventListener('change',async e=>{const t=e.target,f=t.dataset.f;if(!f)return;const fs=[...t.files];if(f=='imgs')for(const x of fs){const u=await shrink(x,1000);if(u)A.ed.imgs.push(u)};if(f=='logo'&&fs[0])S.s.logo=await shrink(fs[0],420)||S.s.logo;if(f=='hero'&&fs[0])S.s.hero=await shrink(fs[0],1400)||S.s.hero;theme();paint()});
document.addEventListener('click',e=>{const t=e.target.closest('[data-lv],[data-nx],[data-q],[data-img],[data-go],#mb');if(!t)return;const d=t.dataset;if('go' in d){e.preventDefault();$('#bf').scrollIntoView({behavior:'smooth',block:'start'})}if(t.id=='mb')$('#nv').classList.toggle('open');if('lv' in d){F.l=d.lv;document.querySelectorAll('.ch button').forEach(b=>b.classList.toggle('on',b.dataset.lv==F.l));$('#gr').innerHTML=gridHtml()}if(d.nx||d.img!=null){const n=cur.imgs.length;G=d.nx?(G+ +d.nx+n)%n:+d.img;$('#big').style.backgroundImage=`url('${cur.imgs[G]}')`;document.querySelectorAll('.th i').forEach((i,k)=>i.classList.toggle('on',k==G))}if(d.q){const i=$('#bq');i.value=Math.max(1,(+i.value||1)+ +d.q);i.dispatchEvent(new Event('input'))}});
document.addEventListener('input',e=>{if(e.target.id=='q'){F.q=e.target.value;$('#gr').innerHTML=gridHtml()}});
addEventListener('hashchange',route);theme();route();
(async()=>{try{const r=await fetch('/api/data',{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.s&&j.pkgs){S=j;S.s.faq??=DF;S.s.slogan??='Adventure Without Boundaries';theme();route()}}}catch(e){}
if(T()){try{const r=await fetch('/api/login',{method:'POST',headers:{Authorization:'Bearer '+T()}});if(r.ok){admin=true;paint()}}catch(e){}}})();
document.addEventListener('click',async e=>{if(!e.target.closest('[data-login]'))return;e.preventDefault();const p=prompt('অ্যাডমিন পাসওয়ার্ড');if(!p)return;const r=await fetch('/api/login',{method:'POST',headers:{Authorization:'Bearer '+p}}).catch(()=>null);if(r&&r.ok){sessionStorage.setItem('t',p);admin=true;paint()}else alert('পাসওয়ার্ড ভুল।')});
</script>
</body>
</html>
